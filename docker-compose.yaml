# MCP Integration Lab — gateway + AI-ready services.
#
# All configuration comes from the active profile (profiles/<name>/), selected
# and exported by the mcplab CLI, which sets MCPLAB_PROFILE_DIR plus the port,
# mode, and storage variables before invoking compose. Defaults below match
# profiles/default so plain `docker compose` still works for debugging.
#
# Published ports bind on all interfaces on purpose: remote systems point at
# this host to run integration tests against the lab services.
#
# LabLDAP and TacLab run as their own compose projects (driven by
# `mcplab labldap-up` / `mcplab labtacacs-up` from the vendored repos) and
# meet the gateway on the shared external network `mcplab-shared`.
name: mcplab

networks:
  default:
  shared:
    external: true
    name: mcplab-shared

services:
  # ------------------------------------------------------------------ LabDNS
  # Pinned go-lab-dns v1.1.1 (operator console on GET /; allowLegacyClients in profile YAML). YAML edits:
  # `make reload APP=labdns` — not a full `make up`.
  labdns:
    build:
      context: ./third_party/go-lab-dns
    image: labdns:local
    command: ["serve", "--config=/etc/labdns/config.yaml"]
    networks: [default]
    ports:
      - "${LABDNS_DNS_PORT:-10053}:5353/udp"
      - "${LABDNS_DNS_PORT:-10053}:5353/tcp"
      # Management REST (/v1) + MCP (/mcp) + operator console (GET /).
      - "${LABDNS_REST_PORT:-18080}:8080/tcp"
    volumes:
      - ${MCPLAB_PROFILE_DIR:-./profiles/default}/labdns/bootstrap.yaml:/etc/labdns/config.yaml:ro
      - ./secrets/labdns-token:/etc/labdns/token:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/labdns", "healthcheck", "--url=http://127.0.0.1:8080/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # ------------------------------------------- ratarmount-rs NFS export (POC)
  # Userspace NFSv3 server (ratarmount-rs v0.1.24): no FUSE device, no
  # privileges. Data plane only for now; an MCP wrapper around its control
  # socket is a phase-1 item. NFSv4.1 (`--nfs-vers 4`) is in the .deb but
  # this lab stays on v3 (`nolock`). Reload: `make reload APP=nfs`.
  # Writable overlay (-w) plus live commit into the empty-root .tar.zst
  # (gzip is rejected; :temp: is rejected). Interval is profile-defined.
  nfs:
    build:
      context: ./docker/ratarmount
    image: ratarmount-nfs:local
    # NFS-only mode stays in the foreground; bind beyond loopback so the
    # published port reaches it (ratarmount warns, which is fine for a lab).
    command:
      - "--nfs"
      - "--nfs-bind"
      - "0.0.0.0:20490"
      - "-w"
      - "/work/overlay"
      - "--commit-overlay-on-exit"
      - "--commit-overlay-interval"
      - "${NFS_COMMIT_OVERLAY_INTERVAL:-15m}"
      - "/archives/fixtures.tar.zst"
    networks: [default]
    ports:
      - "${NFS_PORT:-20490}:20490/tcp"
    environment:
      # Archive indexes (sqlite) land under $HOME — point it at the writable
      # work mount so the container has real disk to work with.
      HOME: /work
      XDG_CACHE_HOME: /work
    volumes:
      # Writable: interval/on-exit commit does a sibling copy + atomic replace.
      - ${NFS_ARCHIVE_DIR:-./.data/nfs}:/archives
      - ${NFS_DATA_DIR:-./.data/nfs-work}:/work
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # ----------------------------------------------- LabMail mail sink (receive)
  # Receive-only SMTP sink (LabMail image) with inbox UI, maildev /email
  # compat, native /v1, and MCP on the management listener. Compose service
  # name stays `maildev` so published ports and labinfo id survive the swap.
  # Desired state is the profile's labmail/bootstrap.yaml (validated by
  # internal/maildev: leftover maildev.yaml and relay keys are rejected).
  # Captured mail is process memory / tmpfs — ephemeral by design.
  # Reload: `make reload APP=maildev` (wipes the inbox).
  # Do not inject MAILDEV_ARGS / MAILDEV_WEB_USER / MAILDEV_WEB_PASS:
  # `environment: {}` does not clear operator env, so the keys are omitted.
  maildev:
    build:
      context: ./third_party/go-lab-maildev
    image: labmail:local
    command: ["serve", "--config=/etc/labmail/config.yaml"]
    networks: [default]
    ports:
      - "${MAILDEV_SMTP_PORT:-1025}:1025/tcp"
      - "${MAILDEV_WEB_PORT:-1080}:1080/tcp"
    volumes:
      - ${MCPLAB_PROFILE_DIR:-./profiles/default}/labmail/bootstrap.yaml:/etc/labmail/config.yaml:ro
      - ./secrets/labmail-token:/run/secrets/labmail-token:ro
      - ./secrets/maildev-web-password:/run/secrets/maildev-web-password:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    restart: unless-stopped
    healthcheck:
      # Scratch has no node; ready is HTTP and still requires SMTP bound.
      test: ["CMD", "/labmail", "healthcheck", "--url=http://127.0.0.1:1080/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # LabMITM intercepting HTTP(S) forward proxy.
  # Binary --management-listen defaults to off (unlike LabDNS, whose YAML
  # bind is enough). Do not copy LabDNS command: ["serve", "--config=..."]
  # or HEALTHCHECK fails closed.
  # Reload: `make reload APP=labmitm` (wipes captured flows; generate-mode
  # CA rotates).
  labmitm:
    build:
      context: ./third_party/go-lab-mitmproxy
    image: labmitm:local
    command: ["serve", "--config=/etc/labmitm/config.yaml", "--management-listen=:8088"]
    networks: [default, shared]
    ports:
      - "${LABMITM_PROXY_PORT:-18888}:8888/tcp"
      - "${LABMITM_WEB_PORT:-18088}:8088/tcp"
    volumes:
      - ${MCPLAB_PROFILE_DIR:-./profiles/default}/labmitm/bootstrap.yaml:/etc/labmitm/config.yaml:ro
      - ./secrets/labmitm-token:/run/secrets/labmitm-token:ro
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/labmitm", "healthcheck", "--url=http://127.0.0.1:8088/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # ------------------------------------------------- labinfo service directory
  # First-party MCP service: tells agents the user-facing web/REST URLs of
  # every lab service (endpoints_list) and the protocol-level connection
  # details for configuring clients (connections_list) — and, in dev mode,
  # the credentials for them. New profile port variables must be added to its
  # environment below or ${VAR} expansion in services.yaml won't see them.
  labinfo:
    build:
      context: .
      dockerfile: docker/labinfo/Dockerfile
    image: labinfo:local
    command:
      - "serve"
      - "--config=/etc/labinfo/services.yaml"
      - "--listen=:8080"
      - "--token-file=/run/lab-secrets/labinfo-token"
    networks: [default]
    ports:
      - "${LABINFO_PORT:-18090}:8080/tcp"
    environment:
      LAB_DEV_MODE: ${LAB_DEV_MODE:-false}
      LAB_PUBLIC_HOST: ${LAB_PUBLIC_HOST:-localhost}
      MCP_GATEWAY_PORT: ${MCP_GATEWAY_PORT:-8080}
      LABDNS_DNS_PORT: ${LABDNS_DNS_PORT:-10053}
      LABDNS_REST_PORT: ${LABDNS_REST_PORT:-18080}
      LABLDAP_LDAP_PORT: ${LABLDAP_LDAP_PORT:-3389}
      LABLDAP_LDAPS_PORT: ${LABLDAP_LDAPS_PORT:-3636}
      LABLDAP_HTTPS_PORT: ${LABLDAP_HTTPS_PORT:-8443}
      NFS_PORT: ${NFS_PORT:-20490}
      NFS_COMMIT_OVERLAY_INTERVAL: ${NFS_COMMIT_OVERLAY_INTERVAL:-15m}
      TACLAB_HTTP_PORT: ${TACLAB_HTTP_PORT:-18049}
      TACLAB_LEGACY_PORT: ${TACLAB_LEGACY_PORT:-49}
      TACLAB_TLS_PORT: ${TACLAB_TLS_PORT:-300}
      TACLAB_RADIUS_ACCESS_PORT: ${TACLAB_RADIUS_ACCESS_PORT:-1812}
      TACLAB_RADIUS_ACCT_PORT: ${TACLAB_RADIUS_ACCT_PORT:-1813}
      TACLAB_RADIUS_RADSEC_PORT: ${TACLAB_RADIUS_RADSEC_PORT:-2083}
      TACLAB_RADIUS_DYNAUTH_PORT: ${TACLAB_RADIUS_DYNAUTH_PORT:-3799}
      MAILDEV_SMTP_PORT: ${MAILDEV_SMTP_PORT:-1025}
      MAILDEV_WEB_PORT: ${MAILDEV_WEB_PORT:-1080}
      LABMITM_PROXY_PORT: ${LABMITM_PROXY_PORT:-18888}
      LABMITM_WEB_PORT: ${LABMITM_WEB_PORT:-18088}
    volumes:
      - ${MCPLAB_PROFILE_DIR:-./profiles/default}/labinfo/services.yaml:/etc/labinfo/services.yaml:ro
      # Staged by `mcplab secrets`: world-readable copies of web tokens,
      # connection secrets, and CA PEMs (lab-grade tradeoff; only revealed
      # when LAB_DEV_MODE).
      - ./secrets/labinfo-creds:/run/lab-secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    restart: unless-stopped
    # Reload: `make reload APP=labinfo`
    healthcheck:
      test: ["CMD", "/labinfo", "healthcheck", "--url=http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  # --------------------------------------------------------- MCPJungle gateway
  mcpjungle:
    image: ghcr.io/mcpjungle/mcpjungle:latest
    networks: [default, shared]
    ports:
      - "${MCP_GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_MODE: ${MCPJUNGLE_MODE:-development}
      SQLITE_DB_PATH: /data/mcpjungle.db
      # Trust the LabLDAP lab CA for the HTTPS upstream (Go honors SSL_CERT_FILE).
      SSL_CERT_FILE: /certs/labldap-ca.crt
      OTEL_ENABLED: "false"
    volumes:
      - ./third_party/go-lab-ldap-mcp/secrets/tls/ca.crt:/certs/labldap-ca.crt:ro
    # Gateway registration state is deliberately ephemeral: the profile's JSON
    # configs are the source of truth and `mcplab register` reapplies them.
    tmpfs:
      - /data
    restart: unless-stopped

  # -------------------------------------------------- one-shot registrar (CLI)
  # Not started by `up`; the mcplab CLI drives `docker compose run registrar`.
  registrar:
    image: ghcr.io/mcpjungle/mcpjungle:latest
    profiles: [tools]
    entrypoint: ["/mcpjungle"]
    networks: [default]
    environment:
      LABDNS_TOKEN: ${LABDNS_TOKEN:-}
      LABLDAP_TOKEN: ${LABLDAP_TOKEN:-}
      LABTACACS_TOKEN: ${LABTACACS_TOKEN:-}
      LABINFO_TOKEN: ${LABINFO_TOKEN:-}
      LABMAIL_TOKEN: ${LABMAIL_TOKEN:-}
      LABMITM_TOKEN: ${LABMITM_TOKEN:-}
      MCP_CLIENT_TOKEN: ${MCP_CLIENT_TOKEN:-}
      # CLI stores its server config (enterprise admin token) under $HOME.
      HOME: /cli-home
    volumes:
      - ${MCPLAB_PROFILE_DIR:-./profiles/default}/mcpjungle:/config:ro
      - ./secrets/mcpjungle-home:/cli-home
    restart: "no"
