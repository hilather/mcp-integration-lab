# Overlay applied on top of the vendored LabLDAP compose bundle
# (compose.yaml + compose.ephemeral.yaml; native labldapd is the default
# engine as of v0.3.0).
#
# 1. Rewires the `lab` network onto the shared external network so the MCP
#    gateway (separate compose project) can reach `control:8443`.
# 2. Extends secret-prep to also stage the lab-CA-signed management cert/key
#    (minted by `setuptls generate --management`) into the control-secrets
#    volume, so the control plane can serve verifiable TLS (`tls.mode: files`
#    in our scenario) instead of a self-signed runtime cert.
# 3. Re-publishes the data plane (LDAP/LDAPS) and control plane (HTTPS) on all
#    interfaces with profile-defined host ports — upstream publishes loopback
#    only, but this lab exists for remote systems to test against.
#
# Native directory TLS is the lab CA `directory` cert (no 389 instance-CA
# publish step). `native-secret-prep` in upstream compose.yaml stages
# dm.pw + directory.crt/key from LABLDAP_TLS_DIR / LABLDAP_DM_PASSWORD_FILE.
#
# Requires env vars (absolute paths, exported by the mcplab CLI):
#   MCPLAB_LDAP_TLS            -> <repo>/third_party/go-lab-ldap-mcp/secrets/tls
#   LABLDAP_TLS_DIR            -> same
#   LABLDAP_TLS_CA             -> .../secrets/tls/ca.crt (lab CA)
#   LABLDAP_SECRETS_DIR        -> .../secrets
#   LABLDAP_DM_PASSWORD_FILE   -> .../secrets/dm.pw
# Port republish uses compose `!override` (Compose v2.24.4+).
networks:
  lab:
    external: true
    name: mcplab-shared

services:
  secret-prep:
    volumes:
      - ${MCPLAB_LDAP_TLS}/management.crt:/in/management.crt:ro
      - ${MCPLAB_LDAP_TLS}/management.key:/in/management.key:ro
    command:
      - |
        set -eu
        for f in runtime-ldap token-admin user-alice management.crt management.key; do
          cp "/in/$$f" "/out/$$f"
          chown 65532:65532 "/out/$$f"
          chmod 0400 "/out/$$f"
        done

  directory:
    ports: !override
      - "${LABLDAP_LDAP_PORT:-3389}:3389"
      - "${LABLDAP_LDAPS_PORT:-3636}:3636"

  control:
    ports: !override
      - "${LABLDAP_HTTPS_PORT:-8443}:8443"
