# maildev flags for this profile. Any maildev CLI flag can go under `flags:`
# (long name, without the leading dashes) and the mcplab CLI renders it onto
# the container command line:
#
#   bool true  -> --flag            list  -> --flag v1 v2
#   scalar     -> --flag value      null  -> --flag
#
# Guarded by internal/maildev (regression-tested):
#   * relay/outbound flags (outgoing-*, auto-relay*) are REJECTED — this
#     lab's mail server only receives mail, it never sends any.
#   * smtp/web (container-internal ports) and web-user/web-pass (generated
#     secret) are managed by the lab; host ports live in profile.env.
#
# Full flag list: https://github.com/maildev/maildev#usage
flags: {}
  # Examples:
  # verbose: true
  # hide-extensions: [STARTTLS]
  # incoming-user: smtp-user      # require SMTP AUTH on ingest
  # incoming-pass: smtp-pass
