# LabMITM desired state. Mounted read-only at /etc/labmitm/config.yaml.
# lab-owned copy; do not recopy from the upstream examples tree without
# reviewing allowHosts/Origins. Pin is vendor tag v1.6.0. allowLegacyClients
# is on so MCPJungle can register without a LabMITM patch. Bind-mounted
# secret files must be 0o644 (UID 65532). Reload: `make reload APP=labmitm`
# (wipes captured flows; generate-mode CA rotates). Reload does not
# re-register — gateway SQLite is tmpfs (make up / make register /
# mcpjungle reload).
#
# 1.1–1.4 knobs are written here (permanence). Default off unless noted.
# v1.5.0 KnownFields accepts these keys; do not omit them for a stale
# v1.1.1 image.
#
# Reset-only (1.2 nested): acceptBind / acceptUDPAssociate / acceptUserPass,
# protocols.http2.{clientCleartext,origin,extendedConnect,capturePush,grpcDecode},
# protocols.websocket.inspectFrames, listeners.originalDestination.
# Do not enable BIND/UDP/user-pass/h2c/inspectFrames/orig-dest on the
# published :8888 without a network boundary. Appliance has no CAP_NET_ADMIN.
#
# Live apply (no Reset): hop/accept setFeature (http2, SOCKS CONNECT,
# websocket/connect/absoluteForm, compat.flowREST), replaceCompat prefix,
# replaceTLS (ports included), replaceHTTPAuth, replaceRules, replaceAdmission.
# D22 carve: websocket/connect/absoluteForm stay on unless a scenario
# turns them off. Native /v1 catalog is 31 rows (includes features.get).
# GET /v1/features and MCP mitm_features_list return the frozen 11-row
# hop/accept catalog — not the native REST row count.
#
# 1.4: spec.proxy.httpAuth.enabled: false is a legal field (D76). Do not
# enable HTTP 407 on the published proxy. Rule actions
# (silent/hang/redirect/throttle, phase: websocket) ride replaceRules;
# this profile keeps rules.enabled: false and items: [] (no 1.4 items).
apiVersion: labmitm.dev/v1alpha1
kind: LabMITM
metadata:
  name: lab-proxy
spec:
  listeners:
    proxy:
      address: ":8888"
      acceptSOCKS5: false
      acceptSOCKS4: false
      acceptBind: false
      acceptUDPAssociate: false
      acceptUserPass: false
    management:
      address: ":8088"
      restPath: /v1
      mcpPath: /mcp
      tls:
        enabled: false
        certFile: ""
        keyFile: ""
    originalDestination:
      enabled: false

  proxy:
    hostname: labmitm.lab
    admission:
      maxSessions: 256
      maxSessionsPerIP: 32
      maxInFlight: 64
      maxInFlightBytes: 64MiB
      sessionTimeout: 10m
      idleTimeout: 120s
      headerTimeout: 10s
      dialTimeout: 10s
      upstreamTimeout: 60s
    targets:
      denyCloudMetadata: true
      denyLinkLocal: true
      allowLoopback: true
      allowHosts:
        - "*.lab"
        - labdns
        - labinfo
        - maildev
        - mcpjungle
        - control
        - taclab
        # Optional CONNECT-tunnel names (not HTTP origins; do not uncomment
        # without accepting unauthenticated TCP to these listeners).
        # These lines must stay inside allowHosts so uncommenting is valid YAML.
        # - nfs         # NFSv3 :20490 on default; HTTP_PROXY cannot mount it
        # - directory   # LDAP :3389 / LDAPS :3636 on shared
      denyHosts: []
    httpAuth:
      enabled: false

  tls:
    intercept: true
    hosts: []
    ports: [443]
    ca:
      mode: generate
      certFile: ""
      keyFile: ""
    upstream:
      insecureSkipVerify: false
      extraCAFiles: []

  rules:
    # 1.1-legal off switch; items stays [] (no 1.4 silent/hang/redirect/throttle).
    enabled: false
    items: []

  store:
    maxFlows: 1000
    maxBytes: 256MiB
    maxBodyBytes: 1MiB
    fullPolicy: reject
    maxWait: 60s
    spillDirectory: ""
    spillThreshold: 256KiB

  ui:
    enabled: true

  management:
    auth:
      mode: bearer
      tokens:
        - id: admin
          secretFile: /run/secrets/labmitm-token
          role: administrator
          scopes: [mitm.read, mitm.write, mitm.admin, mitm.audit.read]
    mcp:
      allowLegacyClients: true
    # Exact http(s)://host[:port] Origins. Loopback Origins are already
    # allowed (any port). Missing Origin is allowed (MCPJungle, curl).
    # There is no "*" / "private" sentinel — LabMail's hatch does not
    # apply here. When LAB_PUBLIC_HOST is not localhost, add
    # http://<LAB_PUBLIC_HOST>:18088 (or the profile's LABMITM_WEB_PORT)
    # and reload. LabMITM YAML does not interpolate ${VAR}.
    originAllowlist: []
    bodyLimit: 1MiB
    requestsPerSecond: 32
    burst: 64
    maxConcurrent: 256

  protocols:
    http2:
      enabled: false
      clientCleartext: false
      origin: false
      extendedConnect: false
      capturePush: false
      grpcDecode: false
    websocket:
      enabled: true
      inspectFrames: false
    connect:
      enabled: true
    absoluteForm:
      enabled: true

  compat:
    flowREST:
      enabled: false

  observability:
    logLevel: info
    metrics:
      listen: "127.0.0.1:9090"
      publicPath: false
    audit:
      ring: 128
