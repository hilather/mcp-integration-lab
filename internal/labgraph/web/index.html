<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>labgraph</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 52rem; }
    h1 { font-size: 1.25rem; }
    label, button { display: inline-block; margin: .25rem .25rem .25rem 0; }
    input { width: 20rem; }
    pre { background: #111; color: #eee; padding: .75rem; overflow: auto; }
    .row { margin: .5rem 0; }
    #login { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>labgraph</h1>
  <p>LabScenario orchestrator. UI talks REST only. Token is never stored in localStorage.</p>
  <div id="login">
    <label>Bearer <input id="token" type="password" autocomplete="off"></label>
    <button type="button" id="signin">Sign in</button>
    <button type="button" id="signout">Sign out</button>
  </div>
  <div class="row">
    <button type="button" data-op="list">List</button>
    <label>Name <input id="name" value="default"></label>
    <button type="button" data-op="get">Get</button>
    <button type="button" data-op="validate">Validate</button>
    <button type="button" data-op="plan">Plan</button>
    <button type="button" data-op="apply">Apply</button>
    <button type="button" data-op="fixture-apply">Apply fixture</button>
    <button type="button" data-op="reset">Reset (all five)</button>
    <button type="button" data-op="status">Status</button>
  </div>
  <pre id="out">signed out</pre>
  <script>
    let csrf = "";
    const out = document.getElementById("out");
    async function api(method, path, body) {
      const headers = { "Accept": "application/json" };
      if (csrf && method !== "GET") headers["X-LabGraph-CSRF"] = csrf;
      if (body) headers["Content-Type"] = "application/json";
      const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" });
      const t = await r.text();
      out.textContent = t;
      return r;
    }
    document.getElementById("signin").onclick = async () => {
      const token = document.getElementById("token").value;
      const r = await fetch("/v1/session", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token },
        credentials: "same-origin"
      });
      const j = await r.json().catch(() => ({}));
      csrf = j.csrfToken || "";
      document.getElementById("token").value = "";
      out.textContent = r.ok ? "signed in" : (j.error || r.status);
    };
    document.getElementById("signout").onclick = async () => {
      await api("DELETE", "/v1/session");
      csrf = "";
    };
    document.querySelectorAll("button[data-op]").forEach(btn => {
      btn.onclick = async () => {
        const name = document.getElementById("name").value || "default";
        const op = btn.dataset.op;
        if (op === "list") return api("GET", "/v1/scenarios");
        if (op === "get") return api("GET", "/v1/scenarios/" + encodeURIComponent(name));
        if (op === "status") return api("GET", "/v1/scenarios/" + encodeURIComponent(name) + "/status");
        if (op === "validate") return api("POST", "/v1/scenarios/" + encodeURIComponent(name) + ":validate");
        if (op === "plan") return api("POST", "/v1/scenarios/" + encodeURIComponent(name) + ":plan", {});
        if (op === "apply") return api("POST", "/v1/scenarios/" + encodeURIComponent(name) + ":apply", {});
        if (op === "fixture-apply") return api("POST", "/v1/fixtures/" + encodeURIComponent(name) + ":apply", {});
        if (op === "reset") return api("POST", "/v1/scenarios/" + encodeURIComponent(name) + ":reset", {});
      };
    });
    fetch("/v1/session", { credentials: "same-origin" }).then(r => r.ok ? r.json() : null).then(j => {
      if (j && j.csrfToken) { csrf = j.csrfToken; out.textContent = "session restored"; }
    }).catch(() => {});
  </script>
</body>
</html>
